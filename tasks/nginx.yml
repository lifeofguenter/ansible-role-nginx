---

- name: Set SSL package based on Debian/Ubuntu version
  ansible.builtin.set_fact:
    nginx_ssl_package: >-
      {{ 'libssl1.1' if
           (ansible_facts.distribution == 'Debian'
            and ansible_facts.distribution_major_version|int < 12)
         else 'libssl3' }}

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - make
      - gcc
      - g++
      - git
      - unzip
      - libpcre2-dev
      - libpcre2-8-0
      - zlib1g-dev
      - zlib1g
      - libxslt-dev
      - libxslt1.1
      - libssl-dev
      - "{{ nginx_ssl_package }}"
      - libmaxminddb-dev
      - libmaxminddb0
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install libmodsecurity
  ansible.builtin.apt:
    name:
      - libmodsecurity-dev
      - libmodsecurity3
  become: true
  when: "'http_modsecurity' in nginx_load_modules"

- name: Add modsecurity
  ansible.builtin.set_fact:
    nginx_compile_modsecurity: --add-dynamic-module=/tmp/ModSecurity-nginx-v{{ nginx_modsecurity_version }}
  when: "'http_modsecurity' in nginx_load_modules"

- name: Fetch sources
  ansible.builtin.unarchive:
    src: "{{ item }}"
    dest: /tmp
    remote_src: true
  with_items:
    - https://nginx.org/download/nginx-{{ nginx_version }}.tar.gz

- name: Cleanups
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /tmp/ngx_brotli-{{ nginx_brotli_version }}
    - /tmp/headers-more-nginx-module-{{ nginx_headers_more_version }}
    - /tmp/ngx-fancyindex-{{ nginx_fancyindex_version }}
    - /tmp/ngx_http_geoip2_module-{{ nginx_geoip2_version }}
    - /tmp/ModSecurity-nginx-v{{ nginx_modsecurity_version }}
    - /tmp/njs-{{ nginx_njs_version }}
  become: true

- name: Download ngx_*
  ansible.builtin.unarchive:
    src: "{{ item }}"
    dest: /tmp
    remote_src: true
  with_items:
    - https://github.com/openresty/headers-more-nginx-module/archive/v{{ nginx_headers_more_version }}.zip
    - https://github.com/aperezdc/ngx-fancyindex/archive/v{{ nginx_fancyindex_version }}.tar.gz
    - https://github.com/leev/ngx_http_geoip2_module/archive/refs/tags/{{ nginx_geoip2_version }}.tar.gz
    - "https://github.com/owasp-modsecurity/ModSecurity-nginx/releases/download/\
        v{{ nginx_modsecurity_version }}/ModSecurity-nginx-v{{ nginx_modsecurity_version }}.tar.gz"
    - https://github.com/nginx/njs/archive/refs/tags/{{ nginx_njs_version }}.tar.gz

- name: Fetch brotli
  ansible.builtin.git:
    repo: https://github.com/google/ngx_brotli.git
    dest: /tmp/ngx_brotli-{{ nginx_brotli_version }}/
    recursive: true
    update: true
    depth: 1
    version: '{{ nginx_brotli_version }}'

- name: Create brotli/out
  ansible.builtin.file:
    path: /tmp/ngx_brotli-{{ nginx_brotli_version }}/deps/brotli/out
    state: directory
    mode: '0755'

- name: Compile brotli
  ansible.builtin.command: '{{ item }}'
  args:
    chdir: /tmp/ngx_brotli-{{ nginx_brotli_version }}/deps/brotli/out
  with_items:
    - >-
      cmake
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=./installed ..
    - cmake --build . --config Release --target brotlienc
  changed_when: true
  failed_when: false

- name: Make clean
  ansible.builtin.command: make clean
  args:
    chdir: /tmp/nginx-{{ nginx_version }}
  changed_when: true
  failed_when: false

- name: Configure
  ansible.builtin.command: >
    ./configure
    --prefix=/usr/share/nginx
    --sbin-path=/usr/sbin/nginx
    --conf-path=/etc/nginx/nginx.conf
    --http-log-path=/var/log/nginx/access.log
    --error-log-path=/var/log/nginx/error.log
    --lock-path=/var/lock/nginx.lock
    --pid-path=/run/nginx.pid
    --http-client-body-temp-path=/var/cache/nginx/client
    --http-proxy-temp-path=/var/cache/nginx/proxy
    --http-fastcgi-temp-path=/var/cache/nginx/fastcgi
    --http-uwsgi-temp-path=/var/cache/nginx/uwsgi
    --http-scgi-temp-path=/var/cache/nginx/scgi
    --without-select_module
    --without-poll_module
    --with-threads
    --with-file-aio
    --with-http_ssl_module
    --with-http_realip_module
    --with-http_stub_status_module
    --with-http_v2_module
    --with-http_v3_module
    --with-http_gunzip_module
    --with-http_gzip_static_module
    --with-http_auth_request_module
    --with-http_secure_link_module
    --with-http_mp4_module
    --with-http_slice_module
    --without-http_memcached_module
    --with-compat
    --add-module=/tmp/ngx_brotli-{{ nginx_brotli_version }}
    --add-module=/tmp/headers-more-nginx-module-{{ nginx_headers_more_version }}
    --add-module=/tmp/ngx_http_geoip2_module-{{ nginx_geoip2_version }}
    --add-dynamic-module=/tmp/ngx-fancyindex-{{ nginx_fancyindex_version }}
    --add-dynamic-module=/tmp/njs-{{ nginx_njs_version }}/nginx
    {{ nginx_compile_modsecurity | default('') }}
  args:
    chdir: /tmp/nginx-{{ nginx_version }}
  changed_when: true

- name: Make
  ansible.builtin.command: make -j{{ nginx_make_jobs }}
  args:
    chdir: /tmp/nginx-{{ nginx_version }}
  changed_when: true

- name: Install
  ansible.builtin.command: make install
  args:
    chdir: /tmp/nginx-{{ nginx_version }}
  changed_when: true
  become: true
  notify: nginx_restart
