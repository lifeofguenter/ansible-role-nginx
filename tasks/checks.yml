---

- name: Check if nginx is installed
  ansible.builtin.stat:
    path: /usr/sbin/nginx
  register: nginx_binary

- name: Get current nginx version
  ansible.builtin.command: /usr/sbin/nginx -V
  register: nginx_current
  changed_when: false
  failed_when: false
  when: nginx_binary.stat.exists

- name: Check if munin-node is installed
  ansible.builtin.command: dpkg -L munin-node
  register: nginx_munin_node_check
  changed_when: false
  failed_when: "'command not found' in nginx_munin_node_check.stderr"

- name: Check if fail2ban is installed
  ansible.builtin.command: dpkg -L fail2ban
  register: nginx_fail2ban_check
  changed_when: false
  failed_when: "'command not found' in nginx_fail2ban_check.stderr"
