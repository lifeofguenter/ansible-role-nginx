---

- name: Import checks.yml
  ansible.builtin.import_tasks: checks.yml

- name: Import nginx.yml
  ansible.builtin.import_tasks: nginx.yml
  when: >-
    not nginx_binary.stat.exists
    or nginx_current.rc | default(1) != 0
    or not nginx_current.stderr | default('') is search(nginx_version_string_match)

- name: Import config.yml
  ansible.builtin.import_tasks: config.yml

- name: Import munin-plugin.yml
  ansible.builtin.import_tasks: munin-plugin.yml
  when: nginx_munin_node_check.rc == 0

- name: Import fail2ban-jail.yml
  ansible.builtin.import_tasks: fail2ban-jail.yml
  when: nginx_fail2ban_check.rc == 0
