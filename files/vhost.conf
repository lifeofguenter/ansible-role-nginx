server {
  listen 80 default_server;
  more_set_headers 'Content-Type: text/html; charset=utf-8';
  return 404 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>404 page not found</title><style>:root{--bg:#fafafa;--fg:#1a1a1a;--muted:#555;--accent:#0066cc}@media (prefers-color-scheme:dark){:root{--bg:#1a1a1a;--fg:#f0f0f0;--muted:#aaa;--accent:#6ea8ff}}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:1.125rem;line-height:1.6;max-width:40rem;margin:0 auto;padding:4rem 1.5rem}h1{font-size:2rem;margin-bottom:1rem}p{color:var(--muted)}</style></head><body><h1>404 page not found</h1><p>&#129300; watcha doing?</p></body></html>';
}
